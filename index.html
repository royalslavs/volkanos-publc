<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOLKANOS</title>
<style>
:root{color-scheme:dark;--o:#ff6a00;--r:#ff2d00;--g:#5ee27a}*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden}body{background:#050302;color:#fff2e8;font:14px system-ui}
.boot{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#3a1004,#0d0502 45%,#030202 80%)}.card{width:min(760px,92vw);padding:30px;border:1px solid #6d2b0e;border-radius:18px;background:#100704f7;box-shadow:0 0 90px #7c1c0044}.brand{font-size:42px;font-weight:900;letter-spacing:.08em;text-shadow:0 0 18px #ff4d00}.brand span{color:var(--o)}.sub{color:#bd9c8b;margin:5px 0 22px}.progress{height:12px;background:#210b05;border:1px solid #55200c;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--r),var(--o),#ffb000);box-shadow:0 0 18px #ff5a00}.status{display:flex;justify-content:space-between;margin-top:10px;color:#ffd9c5}.logs{height:245px;margin-top:18px;padding:13px;background:#070303;border:1px solid #321209;border-radius:10px;overflow:auto;font:12px Consolas}.log{margin-bottom:7px}.ok{color:var(--g)}.warn{color:#ffb000}.err{color:#ff6b55}.dim{color:#806558}#retry{display:none;margin-top:12px;background:#251008;color:white;border:1px solid #71300e;border-radius:8px;padding:9px 13px}
.shell{height:100%;display:grid;grid-template-rows:56px 1fr;background:#000}.top{display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #3c1609;background:linear-gradient(90deg,#160703,#0c0402)}.logo{font-size:20px;font-weight:900;letter-spacing:.12em}.logo b{color:var(--o)}.state{margin-left:auto;color:#bd9c8b}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 9px var(--g);margin-right:7px}.main{position:relative;min-height:0;background:#000}video{width:100%;height:100%;display:block;object-fit:contain;background:#000}.input{position:absolute;inset:0;z-index:2;outline:none}.console{position:absolute;right:16px;bottom:16px;z-index:4;width:min(520px,calc(100vw - 32px));max-height:190px;overflow:auto;padding:10px;border:1px solid #55200c;border-radius:9px;background:#090403dd;font:12px Consolas}.console div{margin-bottom:5px}.good{color:var(--g)}.bad{color:#ff735d}
</style></head><body><div id="app">
<section id="boot" class="boot"><div class="card"><div class="brand">VOLK<span>ANOS</span></div><div class="sub">Steam Link Android runtime • desktop mode • 1920×1080</div><div class="progress"><div id="bar" class="bar"></div></div><div class="status"><span id="stage">Starting VOLKANOS...</span><span id="pct">0%</span></div><div id="logs" class="logs"></div><button id="retry">Retry startup</button></div></section>
<section class="shell"><header class="top"><div class="logo">VOLK<b>ANOS</b></div><div class="state"><span class="dot"></span>Steam Link runtime</div></header><main class="main"><video id="video" autoplay muted playsinline></video><div id="input" class="input" tabindex="0"></div><div id="console" class="console"></div></main></section></div>
<script>
const APK="/steamlink-android.apk",PACKAGE="com.valvesoftware.steamlink",$=x=>document.getElementById(x),logs=$("logs"),bar=$("bar"),pct=$("pct"),stage=$("stage"),retry=$("retry"),video=$("video"),input=$("input"),boot=$("boot"),con=$("console");let ms,sb,aborter,gesture;
const stamp=()=>new Date().toLocaleTimeString();
function log(s,c=""){let e=document.createElement("div");e.className="log "+c;e.textContent="["+stamp()+"] "+s;logs.appendChild(e);logs.scrollTop=logs.scrollHeight}
function progress(n,s){bar.style.width=Math.max(0,Math.min(100,n))+"%";pct.textContent=Math.round(n)+"%";stage.textContent=s}
function screen(s,c=""){let e=document.createElement("div");e.className=c;e.textContent=stamp()+"  "+s;con.appendChild(e);con.scrollTop=con.scrollHeight}
async function api(p,o={}){let r=await fetch("/api"+p,o);if(!r.ok){let t="HTTP "+r.status;try{let j=await r.json();t=j.error||j.message||t}catch{}throw Error(t)}return r.headers.get("content-type")?.includes("json")?r.json():r}
async function bridge(){for(let i=1;i<=60;i++){try{let d=await api("/device-info");log("Android bridge is responding.","ok");return d}catch(e){log("Waiting for Android bridge... ("+i+"/60)","dim");await new Promise(r=>setTimeout(r,1000))}}throw Error("Android bridge did not become ready.")}
async function profile(){log("Selecting desktop profile: 1920×1080 landscape.");await api("/device-profile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({profile:"tv"})});log("Desktop profile applied.","ok")}
async function readAPK(){let r=await fetch(APK,{cache:"no-store"});if(!r.ok)throw Error("Bundled APK could not be read: HTTP "+r.status);let total=+(r.headers.get("content-length")||0),rd=r.body.getReader(),a=[],got=0,last=-1;while(1){let {done,value}=await rd.read();if(done)break;a.push(value);got+=value.byteLength;if(total){let p=got/total*100;progress(5+p*.15,"Downloading Steam Link APK... "+Math.round(p)+"%");let b=Math.floor(p/10);if(b!==last){last=b;log("APK download: "+(got/1048576).toFixed(1)+" / "+(total/1048576).toFixed(1)+" MiB","dim")}}}log("Bundled APK downloaded: "+(got/1048576).toFixed(1)+" MiB.","ok");return new Blob(a,{type:"application/vnd.android.package-archive"})}
function install(blob){return new Promise((resolve,reject)=>{let x=new XMLHttpRequest();x.open("POST","/api/install");x.upload.onprogress=e=>{if(e.lengthComputable){let p=e.loaded/e.total*100;progress(20+p*.5,"Installing Steam Link APK... "+Math.round(p)+"%");let b=Math.floor(p/10);if(b!==install.last){install.last=b;log("Install upload: "+(e.loaded/1048576).toFixed(1)+" / "+(e.total/1048576).toFixed(1)+" MiB","dim")}}};x.onload=()=>x.status>=200&&x.status<300?resolve((()=>{try{return JSON.parse(x.responseText||"{}")}catch{return {}})()):reject(Error("APK install failed: HTTP "+x.status+" "+x.responseText));x.onerror=()=>reject(Error("Network error while installing APK."));x.ontimeout=()=>reject(Error("APK install timed out."));x.timeout=600000;let f=new FormData();f.append("apk",blob,"steamlink-android.apk");x.send(f)})}
async function launch(){log("Launching "+PACKAGE+"...");await api("/launch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({package:PACKAGE})});log("Steam Link launch command accepted.","ok")}
function mime(){let a=['video/mp4; codecs="avc1.42C02A"','video/mp4; codecs="avc1.42C029"','video/mp4'];return a.find(x=>!window.MediaSource||MediaSource.isTypeSupported(x))||a[0]}
async function stream(){if(aborter)aborter.abort();aborter=new AbortController();ms=new MediaSource();video.src=URL.createObjectURL(ms);await new Promise((r,j)=>{ms.addEventListener("sourceopen",r,{once:true});ms.addEventListener("error",()=>j(Error("MediaSource error")),{once:true})});sb=ms.addSourceBuffer(mime());sb.mode="segments";let r=await fetch("/api/display-video?bit_rate=8000000&max_size=1080&max_fps=30",{signal:aborter.signal});if(!r.ok)throw Error("Display stream returned HTTP "+r.status);screen("1080p display stream connected.","good");let rd=r.body.getReader(),q=[],busy=false,append=()=>{if(busy||sb.updating||!q.length)return;busy=true;try{sb.appendBuffer(q.shift())}catch(e){busy=false;screen("Video buffer error: "+e.message,"bad");return}sb.addEventListener("updateend",()=>{busy=false;append()},{once:true})};while(1){let {done,value}=await rd.read();if(done)break;q.push(value.buffer.slice(value.byteOffset,value.byteOffset+value.byteLength));append()}}
async function inputEvent(b){let r=await fetch("/api/input-event",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});if(!r.ok)throw Error("Input HTTP "+r.status)}
function ratios(e){let r=input.getBoundingClientRect();return{xRatio:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),yRatio:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
input.onpointerdown=e=>{input.focus();let p=ratios(e);gesture={...p,id:e.pointerId,t:Date.now(),m:false};input.setPointerCapture(e.pointerId)}
input.onpointermove=e=>{if(gesture&&gesture.id===e.pointerId){let p=ratios(e);if(Math.abs(p.xRatio-gesture.xRatio)>.012||Math.abs(p.yRatio-gesture.yRatio)>.012)gesture.m=true}}
input.onpointerup=async e=>{if(!gesture)return;let g=gesture;gesture=null,p=ratios(e);try{await inputEvent(!g.m?{type:"tap",xRatio:g.xRatio,yRatio:g.yRatio}:{type:"swipe",startXRatio:g.xRatio,startYRatio:g.yRatio,endXRatio:p.xRatio,endYRatio:p.yRatio,durationMs:Math.max(120,Date.now()-g.t)})}catch(x){screen(x.message,"bad")}}
input.onkeydown=async e=>{let m={Escape:"GoBack",Backspace:"Backspace",Delete:"Delete",Enter:"Enter",Tab:"Tab",ArrowUp:"ArrowUp",ArrowDown:"ArrowDown",ArrowLeft:"ArrowLeft",ArrowRight:"ArrowRight"};try{if(m[e.key]){e.preventDefault();await inputEvent({type:"key",key:m[e.key]})}else if(e.key===" "){e.preventDefault();await inputEvent({type:"key",key:"Space"})}else if(e.key.length===1)await inputEvent({type:"text",text:e.key})}catch(x){screen(x.message,"bad")}}
async function bootIt(){retry.style.display="none";logs.innerHTML="";try{progress(2,"Checking Android bridge...");log("VOLKANOS startup sequence beginning.");let d=await bridge();progress(10,"Android emulator ready.");log("Android reports "+(d.screen?.width||1920)+"×"+(d.screen?.height||1080)+".","ok");await profile();progress(18,"Desktop profile ready.");log("Reading bundled Steam Link APK...");let blob=await readAPK();progress(20,"Uploading APK to Android...");let data=await install(blob);progress(75,"APK installed.");log("Package manager accepted "+(data.package||PACKAGE)+".","ok");await launch();progress(84,"Steam Link starting...");await new Promise(r=>setTimeout(r,1500));progress(90,"Opening fullscreen desktop display...");await stream();progress(100,"VOLKANOS is running.");log("Steam Link display is live.","ok");setTimeout(()=>boot.style.display="none",700);input.focus()}catch(e){progress(parseInt(pct.textContent)||0,"Startup stopped.");log("STARTUP ERROR: "+e.message,"err");log("The log stays visible so the failure can be diagnosed.","warn");retry.style.display="block"}}
retry.onclick=bootIt;bootIt();
</script></body></html>
