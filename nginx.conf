server {
 listen 80; server_name _; root /usr/share/nginx/html; index index.html;
 location = /steamlink-android.apk { add_header Cache-Control "no-store"; add_header Content-Type "application/vnd.android.package-archive"; try_files $uri =404; }
 location /api/ {
  proxy_pass http://apkbridge:5000/; proxy_http_version 1.1;
  proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off; proxy_request_buffering off; proxy_read_timeout 1h; proxy_send_timeout 1h;
  client_max_body_size 256m; add_header X-Accel-Buffering no always;
 }
 location / { try_files $uri $uri/ /index.html; }
}
